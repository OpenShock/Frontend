name: containerize
description: Builds the frontend Docker image for a single platform and, if requested, pushes it by digest (tags are applied later by `containerize-merge`)
inputs:
  registry:
    required: true
    description: Container registry to push the image to
  registry-path:
    required: true
    description: Path to the image in the container registry
  registry-username:
    required: true
    description: Username to log in to the container registry
  registry-password:
    required: true
    description: Password to log in to the container registry
  push-image:
    required: true
    description: If true, pushes the untagged per-platform image and uploads its digest as an artifact
  platform:
    required: true
    description: Target platform (e.g. `linux/amd64`, `linux/arm64`). Should match the runner's native architecture to avoid QEMU emulation.

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to Container Registry
      uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    # Image references must be lowercase, but registry-path usually contains the org name (`OpenShock`).
    - name: Resolve image name
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.registry-path }}
      run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

    # Only labels are used here; tags are applied to the multi-arch manifest in `containerize-merge`.
    - name: Extract metadata (labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ steps.image.outputs.name }}

    - name: Build and push Docker image by digest
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: ${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ inputs.push-image }}
        build-args: |
          GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          GIT_COMMIT_SHA=${{ github.sha }}

    - name: Export digest
      id: digest
      if: inputs.push-image == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        echo "artifact-name=digests-${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload digest
      if: inputs.push-image == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.digest.outputs.artifact-name }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
