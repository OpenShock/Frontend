name: ci-lint

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # `update-toolchain.yml` moves `ARG PNPM_VERSION` and `packageManager` together.
      # A hand-edited bump can move one and leave the other, so the container would build
      # with a different pnpm than CI and local installs use.
      - name: Check pnpm Version Consistency
        run: |
          docker_pnpm="$(sed -n 's/^ARG PNPM_VERSION=//p' Dockerfile)"
          pkg_pnpm="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          if [ "$docker_pnpm" != "$pkg_pnpm" ]; then
            echo "::error::Dockerfile ARG PNPM_VERSION ($docker_pnpm) does not match package.json packageManager (pnpm@$pkg_pnpm)"
            exit 1
          fi
          echo "pnpm $pkg_pnpm is consistent across Dockerfile and package.json"

      - name: Install pnpm & dependencies
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true
          run_install: |
            - args: [--frozen-lockfile, --strict-peer-dependencies]

      # A stale lockfile entry can keep a second copy of a package that every range
      # accepts a single version of. For svelte that surfaces as confusing type errors,
      # since `SnippetReturn` is a `unique symbol` and so is nominal per declaration file.
      - name: Check Lockfile Deduplication
        run: pnpm dedupe --check

      - name: Run Formatting Check
        run: pnpm run format:check

      - name: Run Linting
        run: pnpm run lint
