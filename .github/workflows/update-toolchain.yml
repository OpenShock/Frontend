on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — same day as Renovate's weekly schedule
  workflow_dispatch: # Manually invoked by user.

name: update-toolchain

permissions:
  contents: write
  pull-requests: write

jobs:
  update-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Resolve latest Node, pnpm, and base OS versions
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          from_line="$(grep -m1 '^FROM node:' Dockerfile)"
          if grep -q 'alpine' <<<"$from_line"; then
            base_family=alpine
          elif grep -qE '(slim|bookworm|trixie|bullseye)' <<<"$from_line"; then
            base_family=debian
          else
            echo "::error::Unrecognized base image family in Dockerfile FROM line: $from_line"
            exit 1
          fi

          # Latest stable Node release across all lines (not locked to the current major).
          # nodejs.org's index is sorted newest-first but also lists prereleases such as
          # v27.0.0-alpha.0, which have no Docker image, so only plain x.y.z versions count.
          new_node="$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[].version | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]' | sed 's/^v//')"

          new_pnpm="$(curl -fsSL https://registry.npmjs.org/pnpm | jq -r '."dist-tags".latest')"

          tags_json="$(curl -fsSL "https://hub.docker.com/v2/repositories/library/node/tags?page_size=100&name=${new_node}")"

          if [ "$base_family" = alpine ]; then
            # Alpine tags are plain numeric (alpine3.23, alpine3.24, ...) - sort and take the highest.
            new_base="$(jq -r '.results[].name' <<<"$tags_json" \
              | grep -E "^${new_node}-alpine[0-9]+\.[0-9]+$" \
              | sed -E 's/^.*-alpine//' \
              | sort -V | tail -n1)"
            new_tag="${new_node}-alpine${new_base}"
          else
            # Debian codenames aren't lexically ordered, so resolve via digest: the plain
            # "-slim" tag is kept aliased upstream to whichever codename is current stable.
            slim_digest="$(jq -r --arg t "${new_node}-slim" '.results[] | select(.name == $t) | .digest' <<<"$tags_json")"
            new_base="$(jq -r --arg d "$slim_digest" --arg plain "${new_node}-slim" \
              '.results[] | select(.name | endswith("-slim")) | select(.name != $plain) | select(.digest == $d) | .name' <<<"$tags_json" \
              | sed -E 's/^.*-([a-z]+)-slim$/\1/' | head -n1)"
            new_tag="${new_node}-${new_base}-slim"
          fi

          # The Dockerfile pins the base image by digest as well as by tag; this is the
          # multi-arch index digest, the same one `docker buildx imagetools inspect` reports.
          new_digest="$(jq -r --arg t "$new_tag" '.results[] | select(.name == $t) | .digest' <<<"$tags_json")"

          if [ -z "$new_node" ] || [ -z "$new_pnpm" ] || [ -z "$new_base" ] || [[ "$new_digest" != sha256:* ]]; then
            echo "::error::Failed to resolve one or more versions (node=$new_node pnpm=$new_pnpm base=$new_base digest=$new_digest)"
            exit 1
          fi

          {
            echo "node=$new_node"
            echo "pnpm=$new_pnpm"
            echo "base_family=$base_family"
            echo "base_version=$new_base"
            echo "image=node:${new_tag}@${new_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply version updates
        shell: bash
        env:
          NEW_NODE: ${{ steps.resolve.outputs.node }}
          NEW_PNPM: ${{ steps.resolve.outputs.pnpm }}
          NEW_IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail

          # The base image is a literal `FROM node:<tag>@<digest>` line, so Node version, base
          # OS and digest all change together by replacing the image reference on it.
          sed -i -E "s|^FROM node:[^[:space:]]+|FROM ${NEW_IMAGE}|" Dockerfile
          if ! grep -qxF "FROM ${NEW_IMAGE}" Dockerfile; then
            echo "::error::Dockerfile has no 'FROM node:...' line to update"
            exit 1
          fi

          sed -i "s/^ARG PNPM_VERSION=.*/ARG PNPM_VERSION=${NEW_PNPM}/" Dockerfile

          echo "$NEW_NODE" > .nvmrc

          sed -i "s/\"packageManager\": *\"pnpm@[^\"]*\"/\"packageManager\": \"pnpm@${NEW_PNPM}\"/" package.json

          # Keep engines.node's major in sync too, since we now track Node's absolute
          # latest release rather than staying locked to whatever major was pinned before.
          new_node_major="${NEW_NODE%%.*}"
          sed -i -E "s/(\"node\": *\")\^[0-9]+(\")/\1^${new_node_major}\2/" package.json

      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- Dockerfile .nvmrc package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Validate the bump ourselves: a PR opened by the default GITHUB_TOKEN does not
      # trigger ci-build.yml's `pull_request` workflow (GitHub's loop-prevention rule),
      # so run the same checks here before opening the PR rather than relying on that.
      - name: Install Node.js
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm & dependencies
        if: steps.diff.outputs.changed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
          run_install: false

      # pnpm records its own version in pnpm-lock.yaml (`packageManagerDependencies`), so the
      # `packageManager` bump above leaves the lockfile stale. Refresh it before the frozen install.
      - name: Refresh lockfile & install dependencies
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: pnpm run check

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: pnpm test:unit

      - name: Build container image
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: docker build --pull -f Dockerfile -t toolchain-update-check:latest .

      # open-pr-from-diff pushes with --force-with-lease when the branch already exists on the
      # remote (an open PR, or a branch left behind by a merged one). The checkout above only
      # fetched the default branch, and a lease with no remote-tracking ref to compare against
      # is rejected as "stale info", so make the ref known first.
      - name: Fetch existing update branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: git fetch origin '+refs/heads/chore/update-toolchain-versions:refs/remotes/origin/chore/update-toolchain-versions' || true

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: OpenShock/actions/open-pr-from-diff@21ca2d511bca92cf24fb502fa302f82700822584 # v1.1.1
        with:
          branch: chore/update-toolchain-versions
          commit-message: 'chore: update Node/pnpm/base image versions'
          title: 'chore: update Node/pnpm/base image versions'
          body: |
            Automated weekly update of the container toolchain.

            | Component | New version |
            |---|---|
            | Node (`.nvmrc` / `engines.node`) | `${{ steps.resolve.outputs.node }}` |
            | pnpm (`PNPM_VERSION` / `packageManager`) | `${{ steps.resolve.outputs.pnpm }}` |
            | Base OS (`${{ steps.resolve.outputs.base_family }}`) | `${{ steps.resolve.outputs.base_version }}` |
            | Base image (Dockerfile `FROM`) | `${{ steps.resolve.outputs.image }}` |

            `pnpm run check`, `pnpm test:unit`, and a container build were run
            against these new versions before this PR was opened.
